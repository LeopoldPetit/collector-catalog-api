name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  promote-prod:
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    uses: LeopoldPetit/collector-infra/.github/workflows/reusable-promote-prod.yml@main
    with:
      image-name: collector-catalog-api
      gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
      gcp-region: ${{ vars.GCP_REGION || 'europe-west1' }}
      artifact-repository: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'collector' }}
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

  lint-test-scan-build:
    if: github.event_name != 'release'
    permissions:
      contents: read
      id-token: write
    uses: LeopoldPetit/collector-infra/.github/workflows/reusable-lint-test-scan-build.yml@main
    with:
      image-name: collector-catalog-api
      push-image: ${{ github.event_name == 'push' }}
      gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
      gcp-region: ${{ vars.GCP_REGION || 'europe-west1' }}
      artifact-repository: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'collector' }}
      workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

  sonar:
    name: Analyse SonarCloud + quality gate
    if: github.event_name != 'release'
    needs: lint-test-scan-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer la couverture produite par lint-test
        uses: actions/download-artifact@v4
        with:
          name: coverage-collector-catalog-api
          path: coverage

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
