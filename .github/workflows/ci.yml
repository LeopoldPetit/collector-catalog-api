name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-scan-build:
    permissions:
      contents: read
      packages: write
    uses: LeopoldPetit/collector-infra/.github/workflows/reusable-lint-test-scan-build.yml@main
    with:
      image-name: ghcr.io/leopoldpetit/collector-catalog-api
      push-image: ${{ github.event_name == 'push' }}

  sonar:
    name: Analyse SonarCloud + quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Tests + couverture
        run: npm run test:cov

      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
